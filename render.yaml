services:
  - type: web
    name: shopping-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: shopping-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: shopping-db
    plan: free
    region: frankfurt
    databaseName: shopping_db
    user: shopping_user
